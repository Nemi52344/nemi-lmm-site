<style>
  .inv-gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center;
    justify-content: center; background: var(--ink); color: var(--bone);
    position: relative; overflow: hidden; }
  .inv-gate::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 108%, rgba(16,163,126,.26), transparent 62%); }
  .inv-gate > .wrap { position: relative; z-index: 1; text-align: center;
    padding-top: 56px; padding-bottom: 56px; }
  .inv-logo { display: inline-block; }
  .inv-logo img { height: 30px; width: auto; }

  .inv-eyebrow { margin-top: 40px; font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase; letter-spacing: 2.5px; font-size: 11px; color: var(--signal); }
  .inv-gate h1 { margin-top: 14px; font-size: clamp(32px, 5vw, 60px); font-weight: 700;
    letter-spacing: -1.8px; line-height: 1.04; }
  /* the emerald rule under the headline is the same instrument mark the rest of
     the system uses — a measured line, ticked, not a decorative underline */
  .inv-rule { margin: 30px auto 0; width: min(220px, 60%); height: 3px; position: relative;
    background: rgba(236,231,221,.12); }
  .inv-rule::after { content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg,
      rgba(236,231,221,.30) 0 1px, transparent 1px 10%); }
  .inv-rule i { display: block; height: 100%; width: 38%; background: var(--signal); }

  .inv-lede { margin: 30px auto 0; max-width: 620px; font-size: 16.5px; line-height: 1.75;
    color: rgba(236,231,221,.72); font-weight: 300; }
  .inv-actions { margin-top: 34px; display: flex; gap: 14px; justify-content: center;
    flex-wrap: wrap; }
  .inv-note { margin: 34px auto 0; max-width: 620px; font-size: 12px; line-height: 1.7;
    color: rgba(236,231,221,.42); }
  .inv-back { display: inline-block; margin-top: 26px; font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--grey);
    text-decoration: none; }
  .inv-back:hover { color: var(--signal); }
  /* .btn's chamfer is a clip-path, and a clip cuts the border stroke itself
     rather than mitring it — so an outlined button loses its top-right edge.
     The filled button keeps the chamfer; the outlined one is square, the same
     call already made for the Invest button in the nav. */
  .inv-actions .btn--ghost { clip-path: none; }
  @media (max-width: 560px) {
    .inv-actions .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<section class="inv-gate">
  <div class="hero__grid"></div>
  <div class="wrap">
    <a class="inv-logo" href="home.html"><img src="assets/img/logo-dark.png?v=2" alt="NEMI"></a>

    <p class="inv-eyebrow">Invest</p>
    <h1>Coming <span class="accent">soon.</span></h1>
    <div class="inv-rule" aria-hidden="true"><i></i></div>

    <p class="inv-lede">Our investment offerings are not open yet. Stay tuned.</p>

    <div class="inv-actions">
      <a class="btn btn--signal" href="blog.html#master-plan">Read the Master Plan</a>
      <a class="btn btn--ghost" href="contact.html">Talk to us</a>
    </div>

    <p class="inv-note">This page is informational. It is not an offer to sell, or a
      solicitation of an offer to buy, any security.</p>

    <a class="inv-back" href="home.html">&larr; Back to nemilmm.com</a>
  </div>
</section>

</body>
</html>
