# ---------------------------------------------------------------------------
# DEMO SITE (Netlify) vs LIVE SITE (EC2, nginx)
#
#   main       -> pulled onto the EC2 box by hand. Netlify does NOT build it.
#   BCA-Ready  -> the demo. Netlify branch deploy, at
#                 https://bca-ready--<site-name>.netlify.app
#
# Everything that is not the production context is told not to be indexed, so a
# demo URL can never turn up in a search result or be quoted back at us. The
# draft pages (_s4, the post template) stay blocked in every
# context, demo included.
# ---------------------------------------------------------------------------
[build]
  publish = "."

[context.branch-deploy]
  [context.branch-deploy.environment]
    DEMO = "true"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Universal API path: the frontend always calls /api/*, and on Netlify it rewrites to the function.
# On a standalone Node host (AWS/VPS/local), server.js handles /api/* directly — so the frontend never changes.
[[redirects]]
  from = "/api/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200
  force = true
[[redirects]]
  from = "/api/verify-otp"
  to = "/.netlify/functions/verify-otp"
  status = 200
  force = true
[[redirects]]
  from = "/api/submit-form"
  to = "/.netlify/functions/submit-form"
  status = 200
  force = true
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# S-4 workspace (evidence audit, change log, legends draft) must never be served.
[[redirects]]
  from = "/_s4/*"
  to = "/home.html"
  status = 404
  force = true

# Blog post template is a working file, not a page.
[[redirects]]
  from = "/_post-template.html"
  to = "/home.html"
  status = 404
  force = true

# The homepage is home.html, not index.html, so "/" has no directory index of
# its own — serve home.html there (200 = rewrite, the URL stays "/").
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

# Anything still pointing at the old filename (bookmarks, inbound links, search
# results) is sent on permanently.
[[redirects]]
  from = "/index.html"
  to = "/home.html"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/offerings.html"
  status = 301
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML must always be revalidated, otherwise copy edits sit behind a stale browser cache
# (assets are safe to cache hard because they carry ?v= cache-busters)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
